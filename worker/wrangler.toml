# Cloudflare Worker: AI proxy for the Tariff Exposure Simulator. See DEPLOY.md.
name = "tes-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
PROVIDER = "anthropic"            # or "openai" for any OpenAI-compatible endpoint
MODEL_QUICK = "claude-haiku-5-5"  # scenario parser
MODEL_DEFAULT = "claude-haiku-5-5" # analyst; switch to "claude-sonnet-5-5" only if Haiku fails the checks
ALLOWED_ORIGINS = "https://shozmoz1401.github.io"
# OPENAI_COMPAT_URL = "https://.../v1/chat/completions"
# OPENAI_COMPAT_MODEL = "..."
# Secrets (never in this file): wrangler secret put ANTHROPIC_API_KEY   (or OPENAI_COMPAT_KEY)

# 10 requests per minute per IP address
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60

# 60 requests per minute across all visitors
[[ratelimits]]
name = "RL_GLOBAL"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 60
  period = 60

# Free-route test copy (HANDOFF_2 C6): `wrangler deploy --env free` -> worker "tes-ai-free".
# Its key is a Worker secret OPENAI_COMPAT_KEY entered in Cloudflare's dashboard (Google AI Studio key).
[env.free]
name = "tes-ai-free"
[env.free.vars]
PROVIDER = "openai"
OPENAI_COMPAT_URL = "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
OPENAI_COMPAT_MODEL = "gemini-3.8-flash"
MODEL_QUICK = "gemini-3.8-flash"
MODEL_DEFAULT = "gemini-3.8-flash"
ALLOWED_ORIGINS = "https://shozmoz1401.github.io"
[[env.free.ratelimits]]
name = "RL_IP"
namespace_id = "1003"
  [env.free.ratelimits.simple]
  limit = 10
  period = 60
[[env.free.ratelimits]]
name = "RL_GLOBAL"
namespace_id = "1004"
  [env.free.ratelimits.simple]
  limit = 60
  period = 60
